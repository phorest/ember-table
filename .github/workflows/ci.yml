name: Ember-Table CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: "Install StepSecurity Action"
        id: step_security
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise and tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      # The corepack bundled with Node 18.20.5 cannot verify npm's current signing keys
      - name: Update and enable corepack
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test
        env:
          CI: true

  test-ember-try:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        ember-version:
          [
            embroider-safe,
            embroider-optimized,
            ember-lts-3.28,
            ember-lts-4.4,
            ember-lts-4.12,
            ember-lts-5.4,
            ember-lts-5.12,
            ember-release,
            # ember-production,
            # Not run in CI (R20-815): it builds and its first test passes, but the second
            # fails inside @html-next/vertical-collection on the docs pages. Run it locally
            # with `pnpm test:ember-compatibility ember-default-docs`.
            # ember-default-docs
          ]

    steps:
      - name: "Install StepSecurity Action"
        id: step_security
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise and tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
      # The corepack bundled with Node 18.20.5 cannot verify npm's current signing keys
      - name: Update and enable corepack
        run: |
          npm install --global corepack@latest
          corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:ember-compatibility ${{ matrix.ember-version }} --skip-cleanup
